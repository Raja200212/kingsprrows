<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script type="text/javascript">
    // SPA Single Page App 404 Fallback Redirect
    var segmentCount = 0;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=' +
      l.pathname.slice(1).split('&').join('~and~') +
      (l.search ? '&q=' + l.search.slice(1).split('&').join('~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
